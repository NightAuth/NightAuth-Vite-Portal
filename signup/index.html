<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>NightAuth Customer Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/portal.css" />
  </head>
  <body class="min-h-screen antialiased" data-title-key="createAccount">
    <div class="min-h-screen bg-[#060608] text-white flex flex-col relative overflow-hidden">
      <svg
        id="grid"
        aria-hidden="true"
        class="pointer-events-none absolute inset-x-0 inset-y-[-30%] h-[200%] w-full skew-y-12 fill-gray-400/30 stroke-gray-400/30 text-gray-400/30 [mask-image:radial-gradient(600px_circle_at_center,white,transparent)]"
      >
        <defs>
          <pattern id="grid-cell" width="40" height="40" patternUnits="userSpaceOnUse" x="-1" y="-1">
            <path d="M.5 40V.5H40" fill="none" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid-cell)" />
        <svg x="-1" y="-1" class="overflow-visible" data-squares></svg>
      </svg>

      <main class="flex-1 flex flex-col items-center justify-center px-4 py-12 relative z-10">
        <div class="w-full max-w-sm space-y-6">
  <div data-portal-state="loading" class="rounded-2xl border border-white/[0.06] bg-white/[0.02] backdrop-blur-2xl shadow-2xl overflow-hidden">
    <div class="border-b border-white/[0.06] px-5 py-4 space-y-2">
      <div class="na-skeleton h-3.5 w-32 rounded"></div>
      <div class="na-skeleton h-2.5 w-48 rounded"></div>
    </div>
    <div class="p-4 space-y-4">
      <div class="na-skeleton h-10 rounded-xl"></div>
      <div class="na-skeleton h-11 rounded-xl"></div>
      <div class="na-skeleton h-11 rounded-xl"></div>
      <div class="na-skeleton h-11 rounded-xl ac-bg-20"></div>
    </div>
  </div>

  <div data-portal-state="notfound" hidden class="text-center space-y-5">
    <div class="mx-auto inline-flex items-center justify-center size-16 rounded-2xl border shadow-2xl bg-rose-500/[0.06] border-rose-500/[0.15]">
      <span data-icon="triangle-alert" class="size-7 text-rose-400"></span>
    </div>
    <div class="space-y-2">
      <h2 class="text-xl font-extrabold text-white" data-i18n="portalNotFoundTitle">Portal Not Found</h2>
      <p class="text-sm text-zinc-400 leading-relaxed" data-i18n="portalNotFoundBody"></p>
    </div>
    <div class="rounded-xl border border-white/[0.08] bg-white/[0.02] p-4">
      <p class="text-xs text-zinc-500 font-mono break-all" data-portal-id></p>
    </div>
  </div>

  <div data-portal-state="offline" hidden class="text-center space-y-5">
    <div class="mx-auto inline-flex items-center justify-center size-16 rounded-2xl border shadow-2xl bg-amber-500/[0.06] border-amber-500/[0.15]">
      <span data-icon="wifi-off" class="size-7 text-amber-400"></span>
    </div>
    <div class="space-y-2">
      <h2 class="text-xl font-extrabold text-white" data-i18n="portalOfflineTitle">Portal Offline</h2>
      <p class="text-sm text-zinc-400 leading-relaxed" data-i18n="portalOfflineBody"></p>
    </div>
  </div>

  <div data-portal-state="ready" hidden class="relative z-20 rounded-2xl border ac-border-18 bg-white/[0.02] backdrop-blur-2xl shadow-2xl">
    <div class="border-b border-white/[0.06] px-5 py-3.5 flex items-center justify-between gap-3 bg-white/[0.01] rounded-t-2xl">
      <div class="min-w-0 flex-1 pr-2">
        <h1 class="text-sm font-extrabold tracking-tight text-white truncate" data-app-name></h1>
        <p class="text-[11px] text-zinc-500 truncate mt-0.5 font-medium" data-i18n="signUpSubtitle"></p>
      </div>
      <div class="shrink-0" data-lang-dropdown></div>
    </div>
    
    <form id="signup-form" class="p-4 space-y-4" novalidate>
      <div class="space-y-1.5">
        <label for="licenseKey" class="na-label"><span data-i18n="licenseRequiredLabel">License Key</span> <span class="ac-text">*</span></label>
        <div class="relative group">
          <input id="licenseKey" name="licenseKey" type="text" autocomplete="off" required class="na-input font-mono uppercase" data-i18n-placeholder="licensePlaceholder" />
          <span data-icon="key-round" class="size-4 na-field-icon"></span>
        </div>
      </div>
      <div class="space-y-1.5">
        <label for="username" class="na-label"><span data-i18n="usernameRequiredLabel">Username</span> <span class="ac-text">*</span></label>
        <div class="relative group">
          <input id="username" name="username" type="text" autocomplete="username" required class="na-input" data-i18n-placeholder="chooseUsernamePlaceholder" />
          <span data-icon="user" class="size-4 na-field-icon"></span>
        </div>
      </div>
      <div class="space-y-1.5">
        <div class="flex items-center justify-between">
          <label for="email" class="na-label" data-i18n="emailLabel">Email</label>
          <span class="text-[10px] text-zinc-600" data-i18n="emailOptional"></span>
        </div>
        <div class="relative group">
          <input id="email" name="email" type="email" autocomplete="email" class="na-input" data-i18n-placeholder="emailPlaceholder" />
          <span data-icon="mail" class="size-4 na-field-icon"></span>
        </div>
      </div>
      <div class="space-y-1.5">
        <label for="password" class="na-label"><span data-i18n="passwordRequiredLabel">Password</span> <span class="ac-text">*</span></label>
        <div class="relative group">
          <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="••••••••" class="na-input pr-10" />
          <span data-icon="lock" class="size-4 na-field-icon"></span>
          <button type="button" data-toggle-password="password" aria-label="Show password" class="absolute right-3.5 top-3.5 text-zinc-600 hover:text-zinc-400 transition cursor-pointer"></button>
        </div>
      </div>

      <div data-captcha></div>

      <button type="submit" class="ac-btn group mt-2 w-full h-11 rounded-xl font-bold text-sm text-white transition-all flex items-center justify-center gap-2 cursor-pointer">
        <span data-i18n="createAccountButton">Create Account</span>
        <span data-icon="arrow-right" class="size-4 transition-transform group-hover:translate-x-0.5"></span>
      </button>

      <div class="pt-2 text-center border-t border-white/[0.04]">
        <p class="text-xs text-zinc-500">
          <span data-i18n="alreadyHaveAccount"></span>
          <a href="/signin/" class="font-bold hover:underline ac-text" data-i18n="signInLink"></a>
        </p>
      </div>
    </form>
  </div>
</div>
      </main>

      <footer class="relative z-10 pb-6 text-center text-[11px] text-zinc-600" data-i18n="poweredBy">Powered by NightAuth</footer>
    </div>

    <script type="module" src="/src/pages/signup.js"></script>
  </body>
</html>
